<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Gitで管理する記事要約アーカイブ" />
    <title>Yoyaku</title>
  </head>
  <body>
    <div class="app-shell">
      <header class="site-header">
        <div class="site-name">要約記事録</div>
        <div class="header-meta">
          <span data-total-count>収録 0件</span>
          <a href="https://github.com/yugo-ibuki/summary-articles" target="_blank" rel="noopener noreferrer">GitHub リポジトリ ↗</a>
        </div>
      </header>

      <section class="lead"><h1>Yoyaku</h1></section>

      <div class="layout">
        <aside class="sidebar" aria-label="記事検索">
          <div class="sidebar-heading"><strong>記事を探す</strong><span data-filter-count>0件</span></div>
          <form id="search-form">
            <label class="search-box">
              <span aria-hidden="true">⌕</span>
              <input id="keyword" name="keyword" type="search" placeholder="キーワードを入力" autocomplete="off" />
            </label>

            <label class="field">ジャンル<select id="genre" name="genre"><option value="">すべて</option></select></label>
            <label class="field">使用技術<select id="technology" name="technology"><option value="">すべて</option></select></label>
            <label class="field">掲載元<select id="source" name="source"><option value="">すべて</option></select></label>

            <fieldset class="date-field">
              <legend>作成日</legend>
              <div class="date-range">
                <input id="created-from" name="createdFrom" type="date" aria-label="作成日の開始" />
                <span>—</span>
                <input id="created-to" name="createdTo" type="date" aria-label="作成日の終了" />
              </div>
            </fieldset>

            <label class="field">読了時間
              <select id="max-minutes" name="maxMinutes">
                <option value="0">指定なし</option>
                <option value="5">5分以内</option>
                <option value="10">10分以内</option>
                <option value="15">15分以内</option>
                <option value="30">30分以内</option>
              </select>
            </label>

            <div class="active-conditions" data-active-conditions aria-live="polite"></div>
            <button class="reset-button" type="reset">条件をすべて解除</button>
          </form>
        </aside>

        <main class="content">
          <div class="content-heading">
            <h2>該当する記事</h2>
            <div class="result-tools">
              <span data-result-count>0 / 0件</span>
              <label class="sort-field"><span class="sr-only">並び順</span>
                <select id="sort" name="sort">
                  <option value="updated-desc">更新日の新しい順</option>
                  <option value="created-desc">作成日の新しい順</option>
                  <option value="title-asc">タイトル順</option>
                </select>
              </label>
            </div>
          </div>
          <div class="notice" data-notice role="status">記事を読み込んでいます。</div>
          <div class="article-grid" data-article-grid></div>
        </main>
      </div>
    </div>

    <dialog class="article-dialog" id="article-dialog">
      <div class="dialog-heading">
        <span>記事の要約</span>
        <button type="button" class="dialog-close" aria-label="閉じる">×</button>
      </div>
      <div class="dialog-body">
        <div class="dialog-meta" data-dialog-meta></div>
        <h2 class="dialog-title" data-dialog-title></h2>
        <div class="dialog-tags" data-dialog-tags></div>
        <div class="dialog-source-row">
          <div class="dialog-dates" data-dialog-dates></div>
          <a class="source-link" data-dialog-source>元記事を開く ↗</a>
        </div>
        <h3 class="summary-label">要約</h3>
        <div class="dialog-summary" data-dialog-summary></div>
      </div>
    </dialog>

    <script type="module" src="/src/client/main.ts"></script>
  </body>
</html>
