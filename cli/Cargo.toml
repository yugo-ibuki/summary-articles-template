[package]
name = "yoyaku"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Validate, enrich, and build article summary data"

[dependencies]
anyhow = "1.0.104"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
clap = { version = "4.6.6", features = ["derive"] }
reqwest = { version = "0.13.4", default-features = false, features = ["blocking", "rustls", "charset"] }
scraper = { version = "=0.24.0", default-features = false }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2.5.8"

[dev-dependencies]
tempfile = "3.27.0"
